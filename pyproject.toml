[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sopa-da-vov-"
version = "0.1.0"
description = "Base mínima para benchmark de IA"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "rogeriodev1971-coder" }]
license = { text = "MIT" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
